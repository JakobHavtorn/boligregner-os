[build-system]
requires = ["uv_build>=0.4"]
build-backend = "uv_build"

[project]
name = "boligregner-os"
version = "0.1.0"
description = "Open-source Danish realkredit mortgage calculator: financing-alternative comparison with 5-year horizon analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Open Source" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
boligregner = "boligregner.http_cli:main"

[tool.uv.build-backend]
module-name = "boligregner"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
